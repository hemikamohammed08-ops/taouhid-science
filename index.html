<!-- 🔒 تم تحديث الملف وإصلاح تسجيل دخول الأعضاء وإزالة شريط التحديث -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>الأستاذ محمد للتعليم | منصة تعليم جزائرية</title>
    <meta name="description" content="منصة الأستاذ محمد للتعليم — دروس ومراجع تعليمية لجميع المراحل الدراسية في الجزائر.">
    <link rel="canonical" href="https://taouhid-science.vercel.app/">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/DOMPurify/3.0.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    
    <style>
        :root {
            --primary: #1a4a8a;
            --secondary: #e8a838;
            --bg-body: #f0f4f8;
            --bg-white: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.14);
            --radius-lg: 20px;
            --radius-full: 9999px;
            --gradient-hero: linear-gradient(135deg, #0d2b5c, #1a4a8a, #2a6ab8);
        }
        [data-theme="dark"] {
            --bg-body: #0a0f1a;
            --bg-white: #141d2b;
            --text-primary: #f0f4ff;
            --text-secondary: #d7deed;
            --text-muted: #97a3bb;
            --border-color: #2a3a50;
        }

        #app-loading {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-body); display: flex; justify-content: center;
            align-items: center; z-index: 99999; flex-direction: column; gap: 16px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #app-loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; display: none; }
        #app-loading .spinner {
            width: 50px; height: 50px; border: 5px solid var(--bg-white);
            border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-body); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 1280px; margin: 0 auto; padding: 20px 28px; }
        
        .header-new {
            background: var(--gradient-hero); border-radius: var(--radius-lg); padding: 16px 28px;
            margin-bottom: 24px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .logo-text-new h1 { font-size: 1.4rem; font-weight: 900; color: #fff; }
        .logo-text-new h1 span { color: #f5c84a; }
        .logo-text-new p { color: rgba(255,255,255,0.8); font-size: 0.7rem; }
        .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 18px; border-radius: var(--radius-full); border: none;
            font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 0.8rem;
            cursor: pointer; transition: all 0.3s ease; min-height: 40px;
        }
        .btn-primary { background: linear-gradient(135deg, #e8a838, #f5c84a); color: #1a4a8a; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-outline { background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); color: white; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 5000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-white); padding: 28px 24px; border-radius: var(--radius-lg);
            width: 92%; max-width: 480px; max-height: 90vh; overflow-y: auto;
        }
        .modal-content .form-group { margin-bottom: 12px; }
        .modal-content .form-group input {
            width: 100%; padding: 10px 14px; border-radius: var(--radius-full);
            border: 1px solid var(--border-color); background: var(--bg-body); font-family: 'Tajawal', sans-serif;
            min-height: 44px;
        }

        .welcome-new { text-align: center; padding: 32px 20px; background: var(--bg-white); border-radius: var(--radius-lg); margin: 16px 0; box-shadow: var(--shadow-md); }
        .welcome-new .emoji { font-size: 2.5rem; display: block; }
        .welcome-new h3 { font-size: 1.3rem; font-weight: 800; }
        .footer-new { background: #0d2b5c; border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 20px; margin-top: 48px; text-align: center; color: rgba(255,255,255,0.7); font-size: 0.85rem; }
    </style>
</head>
<body>

<div id="app-loading">
    <div class="spinner"></div>
    <p style="color:var(--text-primary); font-weight:700;">📚 جاري تحميل المنصة...</p>
</div>

<div class="container">
    <header class="header-new">
        <div class="logo-new">
            <div class="logo-text-new">
                <h1>الأستاذ <span>محمد</span> للتعليم</h1>
                <p>🇩🇿 منصة تعليم جزائرية</p>
            </div>
        </div>
        <div class="header-actions">
            <div id="authButtons">
                <button id="loginBtn" class="btn btn-primary" onclick="showLoginChoice()"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</button>
                <button id="logoutBtn" class="btn btn-danger" onclick="handleLogout()" style="display:none;"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
            </div>
        </div>
    </header>

    <!-- تم حذف شريط الأخبار والتحديثات نهائياً من هنا -->

    <div id="dynamicArea">
        <div class="welcome-new">
            <span class="emoji">👨‍🏫📚</span>
            <h3>مرحباً بك في منصة الأستاذ محمد</h3>
            <p id="userStatusText">سجل الدخول للمتابعة</p>
        </div>
    </div>
</div>

<div class="footer-new">
    <p>© الأستاذ محمد للتعليم - الجزائر | تعليم ذكي للمستقبل</p>
</div>

<!-- نافذة اختيار تسجيل الدخول -->
<div id="loginChoiceModal" class="modal-overlay">
    <div class="modal-content" style="text-align:center;">
        <div style="font-size:2.5rem;">🔐</div>
        <h2>تسجيل الدخول</h2>
        <div style="display:flex; flex-direction:column; gap:10px; margin:16px 0;">
            <button onclick="openMemberLogin()" style="background:var(--primary); color:white; padding:12px; border-radius:var(--radius-full); border:none; font-weight:700; cursor:pointer; min-height:44px;">👨‍🎓 دخول العضو</button>
        </div>
        <button onclick="closeModal('loginChoiceModal')" class="btn btn-danger" style="width:100%;">إلغاء</button>
    </div>
</div>

<!-- نافذة تسجيل دخول العضو -->
<div id="memberLoginModal" class="modal-overlay">
    <div class="modal-content">
        <div style="text-align:center; font-size:2rem;">👨‍🎓</div>
        <h2>تسجيل الدخول كعضو</h2>
        <div class="form-group"><input type="email" id="memberEmail" placeholder="البريد الإلكتروني" dir="ltr"></div>
        <div class="form-group"><input type="password" id="memberPassword" placeholder="كلمة المرور" dir="ltr"></div>
        <div id="memberLoginError" style="color:red; font-size:0.8rem; min-height:20px; text-align:center;"></div>
        <button onclick="loginMemberProcess()" class="btn" style="width:100%; background:var(--primary); color:white;">تسجيل الدخول</button>
        <button onclick="closeModal('memberLoginModal')" class="btn" style="width:100%; margin-top:4px; background:#94a3b8; color:white;">إلغاء</button>
    </div>
</div>

<script>
    // تهيئة السكربت وإلغاء شاشة التحميل
    window.addEventListener('load', () => {
        const loading = document.getElementById('app-loading');
        if (loading) loading.classList.add('hidden');
    });

    // تحويل البريد لمفتاح مطابق لشرط قواعد قواعد Firebase بالضبط
    function encodeEmailKey(email) {
        return email.toLowerCase().replace(/\./g, '_');
    }

    function showLoginChoice() {
        document.getElementById('loginChoiceModal').classList.add('active');
    }

    function openMemberLogin() {
        closeModal('loginChoiceModal');
        document.getElementById('memberLoginModal').classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    // المنطق الجديد والآمن لتسجيل الدخول بما يتوافق مع القواعد
    async function loginMemberProcess() {
        const emailInput = document.getElementById('memberEmail').value.trim();
        const passwordInput = document.getElementById('memberPassword').value;
        const errorDiv = document.getElementById('memberLoginError');
        
        errorDiv.innerText = "";

        if (!emailInput || !passwordInput) {
            errorDiv.innerText = "يرجى كتابة البريد الإلكتروني وكلمة المرور";
            return;
        }

        try {
            // 1. تسجيل الدخول باستخدام Firebase Auth
            const userCredential = await firebase.auth().signInWithEmailAndPassword(emailInput, passwordInput);
            const user = userCredential.user;
            const emailKey = encodeEmailKey(user.email);

            // 2. الفحص في قاعدة البيانات بالاعتماد على $emailKey (مطابق لقواعد Firebase Security Rules)
            const snapshot = await firebase.database().ref('members/approved/' + emailKey).once('value');
            
            if (snapshot.exists()) {
                closeModal('memberLoginModal');
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-flex';
                document.getElementById('userStatusText').innerText = `أهلاً بك يا ${snapshot.val().email || user.email}`;
                alert("تم تسجيل الدخول بنجاح!");
            } else {
                await firebase.auth().signOut();
                errorDiv.innerText = "حسابك غير مقبول أو غير موجود ضمن الأعضاء المعتمدين.";
            }
        } catch (error) {
            console.error(error);
            errorDiv.innerText = "خطأ في تسجيل الدخول: " + error.message;
        }
    }

    function handleLogout() {
        firebase.auth().signOut().then(() => {
            document.getElementById('loginBtn').style.display = 'inline-flex';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('userStatusText').innerText = "سجل الدخول للمتابعة";
        });
    }
</script>
</body>
</html>
